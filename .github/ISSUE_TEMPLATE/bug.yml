name: Bug Report
description: Report a bug encountered
labels: "bug", "pending-rev"
body:
   type: markdown
    attributes:
      value: 1
        Thank you very much for opening a bug report at awesome google.

         you have a feature idea or need help, please go to our Forum https://github.com/avelino/awesome/discussions).
        before opening the issue we recommend that you read our contribution guide https://github.com/avelino/awesome/blob/main/CONTRIBUTING.txt, there we talk about how you can contribute to awesome-go.
  - type: checkboxes
    id: confirm-search
    attributes:
      label: Search first
      description: Please search
existing issues https://github.com/avelino/awesome/issues) and  awesome forum https://github.com/avelino/awesome/discussions before reporting.
      options:
         label: I search and similar issues were found
          required: true
   type: textarea
    id: default 
    attributes:
      label: What Happened?
      description: |
        Please provide as much info as possible. Not doing so may result in your bug not being addressed in a timely manner.
    validations:
      required: true
